<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Onboarding Form</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="app-container">

        <!-- HEADER -->
        <header class="header">

            <div class="logo-container">
                <h1 class="company-name">Labdox</h1>
                <p class="company-tagline">
                    Employee Information Form
                </p>
            </div>

        </header>

        <!-- PROGRESS BAR -->
        <div class="progress-wrapper">

            <div class="progress-info">
                <span id="stepIndicator">Step 1 of 5</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

        </div>

        <!-- FORM -->
        <form id="employeeForm">

            <!-- STEP 1 -->
            <section class="form-step active" id="step-1">

                <div class="step-card">

                    <h2>Step 1</h2>

                    <p>
                        Personal Information Section
                    </p>

                    <div class="button-group next-only">

                        <button
                            type="button"
                            class="btn btn-next"
                            onclick="nextStep()"
                        >
                            Next
                        </button>

                    </div>

                </div>

            </section>

            <!-- STEP 2 -->
            <section class="form-step" id="step-2">

                <div class="step-card">

                    <h2>Step 2</h2>

                    <p>
                        Qualification Section
                    </p>

                    <div class="button-group">

                        <button
                            type="button"
                            class="btn btn-back"
                            onclick="prevStep()"
                        >
                            Back
                        </button>

                        <button
                            type="button"
                            class="btn btn-next"
                            onclick="nextStep()"
                        >
                            Next
                        </button>

                    </div>

                </div>

            </section>

            <!-- STEP 3 -->
            <section class="form-step" id="step-3">

                <div class="step-card">

                    <h2>Step 3</h2>

                    <p>
                        Medical History Section
                    </p>

                    <div class="button-group">

                        <button
                            type="button"
                            class="btn btn-back"
                            onclick="prevStep()"
                        >
                            Back
                        </button>

                        <button
                            type="button"
                            class="btn btn-next"
                            onclick="nextStep()"
                        >
                            Next
                        </button>

                    </div>

                </div>

            </section>

            <!-- STEP 4 -->
            <section class="form-step" id="step-4">

                <div class="step-card">

                    <h2>Step 4</h2>

                    <p>
                        Upload Documents Section
                    </p>

                    <div class="button-group">

                        <button
                            type="button"
                            class="btn btn-back"
                            onclick="prevStep()"
                        >
                            Back
                        </button>

                        <button
                            type="button"
                            class="btn btn-next"
                            onclick="nextStep()"
                        >
                            Next
                        </button>

                    </div>

                </div>

            </section>

            <!-- STEP 5 -->
            <section class="form-step" id="step-5">

                <div class="step-card">

                    <h2>Step 5</h2>

                    <p>
                        Bank Details Section
                    </p>

                    <div class="button-group">

                        <button
                            type="button"
                            class="btn btn-back"
                            onclick="prevStep()"
                        >
                            Back
                        </button>

                        <button
                            type="submit"
                            class="btn btn-submit"
                        >
                            Submit
                        </button>

                    </div>

                </div>

            </section>

        </form>

    </div>

    <script src="js/steps.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
